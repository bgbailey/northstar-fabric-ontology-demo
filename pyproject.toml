[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "northstar-fabric-ontology-demo"
version = "0.1.0"
description = "Synthetic telco demonstration and accelerator for Microsoft Fabric IQ ontology over Power BI semantic models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brendan Bailey" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "jsonschema>=4.23,<5",
  "duckdb>=1.2,<3",
  "pyarrow>=19,<24",
  "tzdata>=2026.5,<2027; sys_platform == 'win32'",
  "msal>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/bgbailey/northstar-fabric-ontology-demo"
Repository = "https://github.com/bgbailey/northstar-fabric-ontology-demo"
Issues = "https://github.com/bgbailey/northstar-fabric-ontology-demo/issues"
Security = "https://github.com/bgbailey/northstar-fabric-ontology-demo/security"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "playwright>=1.50,<2",
]

[project.scripts]
northstar = "telco_iq.cli:main"
telco-iq = "telco_iq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_iq"]

[tool.hatch.build.targets.wheel.force-include]
"tools/build_data.py" = "telco_iq/deploy/assets/build_data.py"
"fabric/semantic-models/network.SemanticModel" = "telco_iq/deploy/assets/semantic-models/network.SemanticModel"
"fabric/semantic-models/enterprise.SemanticModel" = "telco_iq/deploy/assets/semantic-models/enterprise.SemanticModel"
"fabric/semantic-models/finance.SemanticModel" = "telco_iq/deploy/assets/semantic-models/finance.SemanticModel"
"fabric/semantic-models/care.SemanticModel" = "telco_iq/deploy/assets/semantic-models/care.SemanticModel"
"tools/build_ontology_prompts.py" = "telco_iq/ontology/assets/build_ontology_prompts.py"
"tools/check_ontology_conformance.py" = "telco_iq/ontology/assets/check_ontology_conformance.py"
"fabric/ontology/service-assurance.json" = "telco_iq/ontology/assets/service-assurance.json"
"fabric/ontology/service-assurance.prompts.md" = "telco_iq/ontology/assets/service-assurance.prompts.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
