[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telco-iq-lab"
version = "0.1.0"
description = "Synthetic, evidence-first cross-model Fabric IQ ontology lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "jsonschema>=4.23,<5",
  "duckdb>=1.2,<2",
  "pyarrow>=19,<24",
  "tzdata>=2026.5,<2027; sys_platform == 'win32'",
  "msal>=1.30,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "playwright>=1.50,<2",
]

[project.scripts]
telco-iq = "telco_iq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_iq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
